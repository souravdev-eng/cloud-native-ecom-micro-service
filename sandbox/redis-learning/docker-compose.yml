# Local Redis for the course labs. Each profile is one lab environment:
#   single       Redis on localhost:6390 + latency proxy on 6391 (Lessons 0, 2–6)
# Later lessons add `replication` and `cluster`.
#
# Host ports start at 6390 so they never clash with a
# `kubectl port-forward` to the cluster's product-redis on 6379.
name: redis-learning

services:
  lab-redis:
    image: redis:7.4.11-alpine
    profiles: [single]
    # Lab data is throwaway, so persistence is off.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  lab-toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: [single]
    ports:
      - "127.0.0.1:6391:6391"
      - "127.0.0.1:8474:8474"
    depends_on:
      lab-redis:
        condition: service_healthy

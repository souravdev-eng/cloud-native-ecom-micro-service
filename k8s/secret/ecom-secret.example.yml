# ============================================================
# SINGLE SECRET TEMPLATE — credentials for ALL services
# ============================================================
# This is the only committed file in k8s/secret/ (the rest of the
# folder is gitignored). Copy it and fill in real values:
#
#   cp k8s/secret/ecom-secret.example.yml k8s/secret/ecom-secret.yml
#   $EDITOR k8s/secret/ecom-secret.yml
#   kubectl apply -f k8s/secret/ecom-secret.yml
#
# Or generate it straight from the repo-root .env (no plaintext
# manifest on disk):
#
#   ./scripts/create-secret.sh ecom
#
# Every service loads it via:
#   envFrom:
#     - secretRef:
#         name: ecom-secret
#
# `stringData` takes plain text — Kubernetes base64-encodes it.
# Do NOT pre-encode values here.
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: ecom-secret
  labels:
    app: ecom
type: Opaque
stringData:
  # ---- Auth ------------------------------------------------
  JWT_KEY: '<your-jwt-signing-key>'

  # ---- MongoDB (auth, product, review) ---------------------
  MONGO_USER: '<mongo-username>'
  MONGO_PASSWORD: '<mongo-password>'
  AUTH_SERVICE_MONGODB_URL: 'mongodb+srv://<user>:<password>@<cluster>.mongodb.net/ecom-user-db?retryWrites=true&w=majority'
  PRODUCT_SERVICE_MONGODB_URL: 'mongodb+srv://<user>:<password>@<cluster>.mongodb.net/ecom-product-db?retryWrites=true&w=majority'
  REVIEW_MONGODB_URL: 'mongodb+srv://<user>:<password>@<cluster>.mongodb.net/review?retryWrites=true&w=majority'

  # ---- PostgreSQL ------------------------------------------
  # POSTGRES_PASSWORD seeds the in-cluster postgres pod (k8s/postgres-depl.yml).
  # CART_DB_URL must match it.
  POSTGRES_PASSWORD: '<postgres-password>'
  CART_DB_URL: 'postgres://cartuser:<postgres-password>@postgres-srv:5432/cartdb'
  # Order runs on an external Postgres (Neon). Mapped to DB_URL in order-depl.yml.
  ORDER_DB_URL: 'postgresql://<user>:<password>@<host>/<db>?sslmode=require'

  # ---- Email (auth, notification) --------------------------
  # Gmail requires an App Password, not your account password:
  # https://support.google.com/accounts/answer/185833
  EMAIL_USER: '<your-email@gmail.com>'
  EMAIL_APP_PASSWORD: '<gmail-app-password>'

  # ---- Payments (order) ------------------------------------
  STRIPE_SECRET_KEY: '<stripe-secret-key>'

  # ---- Optional: S3 image upload (product) -----------------
  # AWS_ACCESS_KEY_ID: '<aws-access-key-id>'
  # AWS_SECRET_ACCESS_KEY: '<aws-secret-access-key>'
  # AWS_BUCKET_NAME: '<bucket-name>'
  # AWS_BUCKET_REGION: '<bucket-region>'

apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product
  template:
    metadata:
      labels:
        app: product
    spec:
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z -w 2 rabbitmq-srv 5672; do sleep 2; done
      containers:
        - name: product
          image: souravdeveloper/ecom-product
          envFrom:
            - configMapRef:
                name: ecom-config
            - secretRef:
                name: ecom-secret
---
apiVersion: v1
kind: Service
metadata:
  name: product-srv
spec:
  selector:
    app: product
  type: ClusterIP
  ports:
    - name: product
      targetPort: 4000
      port: 4000
      protocol: TCP

# ============================================================
# GRAFANA ALLOY — the single telemetry collector
# ============================================================
# Two pipelines today:
# - Logs: it tails every container's stdout through the Kubernetes
#   API, parses the JSON lines written by the @ecom-micro/common
#   logger, and pushes them to Loki.
# - Traces: it receives OTLP from the services (gRPC 4317, HTTP 4318,
#   via alloy-srv), batches the spans and forwards them to Tempo.
# Later tickets add metrics, tail sampling and the second redaction
# layer to this same config.
#
# A DaemonSet runs one Alloy per node, and each instance only tails
# pods scheduled on its own node, so a log line is never shipped twice.
# ============================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  labels:
    app: alloy
---
# Read-only access: discover pods and stream their logs from the API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy
  labels:
    app: alloy
rules:
  - apiGroups: ['']
    resources: ['pods', 'pods/log', 'namespaces', 'nodes']
    verbs: ['get', 'list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy
  labels:
    app: alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: default
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  labels:
    app: alloy
data:
  config.alloy: |
    // Alloy's own config language only supports // comments.

    // Find every pod on this node. NODE_NAME comes from the downward API.
    discovery.kubernetes "pods" {
      role = "pod"
      selectors {
        role  = "pod"
        field = "spec.nodeName=" + sys.env("NODE_NAME")
      }
    }

    // Loki rejects streams with no labels, and pods that don't use the
    // shared logger (rabbitmq, postgres...) have no JSON "service" field.
    // So "service" starts as the container name, is replaced by the pod's
    // app label when it has one, and the JSON value overrides both below.
    // pod/namespace are set here only so they can be moved into structured
    // metadata later.
    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "service"
      }
      // regex "(.+)" only matches a non-empty value, so pods without an app
      // label (e.g. coredns in kube-system) keep the container-name fallback.
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        regex         = "(.+)"
        target_label  = "service"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.process.json.receiver]
    }

    loki.process "json" {
      forward_to = [loki.write.loki.receiver]

      // Non-JSON lines pass through untouched; only their fallback
      // "service" label is kept.
      stage.json {
        expressions = {
          level    = "level",
          service  = "service",
          trace_id = "trace_id",
        }
      }

      // Only level and service become labels. Every label value creates a
      // separate Loki stream, so anything high-cardinality stays out.
      stage.labels {
        values = {
          level   = "",
          service = "",
        }
      }

      // Structured metadata is stored per line and filterable in LogQL
      // (e.g. {service="auth-service"} | trace_id="4bf9..."), but doesn't
      // create streams. Grafana's trace-to-logs link filters on trace_id.
      // Lines logged outside a request have no trace_id and skip it.
      stage.structured_metadata {
        values = {
          pod       = "",
          namespace = "",
          trace_id  = "",
        }
      }
      stage.label_drop {
        values = ["pod", "namespace"]
      }
    }

    loki.write "loki" {
      endpoint {
        url = "http://loki-srv:3100/loki/api/v1/push"
      }
    }

    // ---------------- Traces ----------------

    // Services export here (OTEL_EXPORTER_OTLP_ENDPOINT in ecom-config).
    // Node services use OTLP/HTTP on 4318; gRPC on 4317 is for the Go
    // review service and anything else that prefers it.
    otelcol.receiver.otlp "default" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }
      http {
        endpoint = "0.0.0.0:4318"
      }
      output {
        traces = [otelcol.processor.batch.default.input]
      }
    }

    // Groups spans into fewer, larger requests to Tempo. If Tempo is
    // down, the exporter's queue fills and then drops spans; services
    // are never slowed down, because they only talk to Alloy.
    otelcol.processor.batch "default" {
      output {
        traces = [otelcol.exporter.otlp.tempo.input]
      }
    }

    otelcol.exporter.otlp "tempo" {
      client {
        endpoint = "tempo-srv:4317"
        // In-cluster traffic only, so plain gRPC without TLS.
        tls {
          insecure = true
        }
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  labels:
    app: alloy
spec:
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.10.0
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
            - --server.http.listen-addr=0.0.0.0:12345
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 12345
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            # Tail positions. An emptyDir is fine locally: after a restart
            # Alloy may re-send a few recent lines.
            - name: data
              mountPath: /var/lib/alloy/data
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: data
          emptyDir: {}
---
# Where services send OTLP. It fronts the DaemonSet's pods;
# internalTrafficPolicy: Local sends each pod's spans to the Alloy on
# its own node, which also skips a cross-node hop once there are several.
# Trade-off: while a node's Alloy isn't ready, spans from that node are
# dropped (requests are unaffected). Check `kubectl get ds alloy` if a
# service's traces go missing.
apiVersion: v1
kind: Service
metadata:
  name: alloy-srv
  labels:
    app: alloy
spec:
  selector:
    app: alloy
  type: ClusterIP
  internalTrafficPolicy: Local
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP

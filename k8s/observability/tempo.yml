# ============================================================
# TEMPO — trace storage (single-binary mode, filesystem on a PV)
# ============================================================
# Receives spans from Alloy over OTLP/gRPC and serves TraceQL
# queries to Grafana. Single-binary runs every Tempo component in
# one process, the recommended mode for a laptop cluster. Blocks are
# kept for 72 hours, enforced by the compactor.
#
# Services never talk to Tempo directly: they export to Alloy
# (alloy-srv:4317/4318), which forwards here. That keeps sampling and
# redaction in one place.
#
# Scale-out path (not built here): object storage (S3/GCS) and the
# distributed deployment mode. The metrics-generator (span metrics,
# service graph) arrives with Prometheus in a later ticket.
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  labels:
    app: tempo
data:
  tempo.yaml: |
    # Single tenant locally, like Loki: no X-Scope-OrgID header needed.
    multitenancy_enabled: false
    usage_report:
      reporting_enabled: false

    server:
      http_listen_port: 3200
      grpc_listen_port: 9095
      log_level: warn

    # Only OTLP/gRPC, and only from Alloy. The port differs from the
    # server's own gRPC port above.
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317

    # Recent traces are held in memory and the WAL, then cut into
    # blocks on disk. Short windows keep a fresh trace searchable soon
    # after the request that produced it.
    ingester:
      max_block_duration: 5m

    compactor:
      compaction:
        block_retention: 72h

    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tempo-pv
spec:
  # An empty class plus the matching empty class on the PVC binds the
  # claim to this hostPath volume instead of a dynamically provisioned one.
  storageClassName: ''
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /mnt/data/tempo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tempo-pvc
spec:
  storageClassName: ''
  volumeName: tempo-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo-deployment
  labels:
    app: tempo
spec:
  replicas: 1
  # Recreate, not RollingUpdate: a ReadWriteOnce volume can't be mounted
  # by the old and new pod at the same time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      # Tempo runs as uid 10001, but hostPath volumes are created root-owned
      # and ignore fsGroup, so an init container hands the directory over.
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ['sh', '-c', 'chown -R 10001:10001 /var/tempo']
          # The pod-level securityContext below would make this run as 10001
          # too, and a non-root user can't chown a root-owned directory.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: storage
              mountPath: /var/tempo
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: tempo
          image: grafana/tempo:2.8.1
          args:
            - -config.file=/etc/tempo/tempo.yaml
            - -target=all
          ports:
            - name: http
              containerPort: 3200
            - name: otlp-grpc
              containerPort: 4317
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
            - name: storage
              mountPath: /var/tempo
      volumes:
        - name: config
          configMap:
            name: tempo-config
        - name: storage
          persistentVolumeClaim:
            claimName: tempo-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: tempo-srv
  labels:
    app: tempo
spec:
  selector:
    app: tempo
  type: ClusterIP
  ports:
    # Grafana queries this port.
    - name: http
      port: 3200
      targetPort: http
      protocol: TCP
    # Alloy pushes spans to this port.
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP

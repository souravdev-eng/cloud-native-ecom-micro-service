apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: /metrics
        prometheus.io/port: '3000'
    spec:
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z -w 2 rabbitmq-srv 5672; do sleep 2; done
      containers:
        - name: auth
          image: souravdeveloper/ecom-auth
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 1
          envFrom:
            - configMapRef:
                name: ecom-config
            - secretRef:
                name: ecom-secret
          env:
            # Standard OTel variable, kept equal to the name in
            # src/tracing.ts. startTelemetry's explicit serviceName wins over
            # it, so this is informational (e.g. for `kubectl describe`);
            # change both together. Shared OTEL/LOG settings are in ecom-config.
            - name: OTEL_SERVICE_NAME
              value: auth-service
            # The downward API exposes the pod's own name and namespace;
            # startTelemetry puts them on every span as k8s.pod.name and
            # k8s.namespace.name.
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
---
apiVersion: v1
kind: Service
metadata:
  name: auth-srv
spec:
  selector:
    app: auth
  type: ClusterIP
  ports:
    - name: auth
      targetPort: 3000
      port: 3000
      protocol: TCP

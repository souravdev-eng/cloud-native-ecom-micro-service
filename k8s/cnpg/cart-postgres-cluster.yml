apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cart-postgres
spec:
  # 1 primary + 1 read replica
  instances: 2

  bootstrap:
    initdb:
      database: cartdb
      owner: cartuser
      secret:
        name: cnpg-cart-credentials

  storage:
    size: 10Gi

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # PostgreSQL configuration tuning
  postgresql:
    parameters:
      shared_buffers: "128MB"
      max_connections: "100"

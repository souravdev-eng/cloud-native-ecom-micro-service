metadata:
  name: cnpg-cart-urls
type: Opaque
data:
  # postgres://cartuser:cart_db_password@cart-postgres-rw:5432/cartdb
  CART_DB_WRITE_URL: cG9zdGdyZXM6Ly9jYXJ0dXNlcjpjYXJ0X2RiX3Bhc3N3b3JkQGNhcnQtcG9zdGdyZXMtcnc6NTQzMi9jYXJ0ZGI=
  # postgres://cartuser:cart_db_password@cart-postgres-ro:5432/cartdb
  CART_DB_READ_URL: cG9zdGdyZXM6Ly9jYXJ0dXNlcjpjYXJ0X2RiX3Bhc3N3b3JkQGNhcnQtcG9zdGdyZXMtcm86NTQzMi9jYXJ0ZGI=
  # Fallback: single URL pointing to primary (backward-compatible)
  CART_DB_URL: cG9zdGdyZXM6Ly9jYXJ0dXNlcjpjYXJ0X2RiX3Bhc3N3b3JkQGNhcnQtcG9zdGdyZXMtcnc6NTQzMi9jYXJ0ZGI=

apiVersion: apps/v1
kind: Deployment
metadata:
  name: etl-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: etl
  template:
    metadata:
      labels:
        app: etl
    spec:
      containers:
        - name: etl
          image: souravdeveloper/ecom-etl
          # CART_DB_URL, PRODUCT_SERVICE_MONGODB_URL, MONGO_USER and
          # MONGO_PASSWORD all arrive via envFrom → ecom-secret below.
          # Only ETL-specific tunables are declared inline here.
          env:
            - name: SYNC_CRON_SCHEDULE
              value: "*/30 * * * *"
            - name: HEALTH_CHECK_CRON_SCHEDULE
              value: "*/5 * * * *"
            - name: ENABLE_SCHEDULER
              value: "true"
            - name: SYNC_BATCH_SIZE
              value: "100"
            - name: TIMEZONE
              value: "UTC"
          envFrom:
            - configMapRef:
                name: ecom-config
            - secretRef:
                name: ecom-secret
---
apiVersion: v1
kind: Service
metadata:
  name: etl-srv
spec:
  selector:
    app: etl
  type: ClusterIP
  ports:
    - name: etl
      targetPort: 4000
      port: 4000
      protocol: TCP
